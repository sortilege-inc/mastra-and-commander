# Mastra & Commander — first playable set (15 cards).
#
# Owner rules pass, 2026-08-13 (see game-design.md decision log). `kind` selects a
# frame variant under svg/v4/<variant>/. Pip vocabulary: value=¢(capital),
# attention=eye, automation=⚙(technology), wild=◌(generic).
#
# Rules mini-syntax: **bold** · *italic* · inline pips {value}{attention}{automation}{wild}.

# ══ FRAMEWORK (framework) ════════════════════════════════════════════════════
- {kind: framework, name: Mastra, traits: [Framework], rules: "The first **Agent** played each round has no cost and incurs no Entropy."}

# ══ OPERATOR (ice) ═══════════════════════════════════════════════════════════
- {kind: operator, name: AgentBrowser, traits: [Tool], consume: [attention], produce: [technology, generic], contributes: [amber/pentagon], rules: "**Call:** Draw 1. Discard 1. Do not add entropy.\n**MCP:** Gain *Durable*."}
- {kind: operator, name: Social Media Manager, traits: [Skill], consume: [generic], produce: [attention], contributes: [amber/triangle], rules: "**Call:** Gain {attention}{attention}\n**Attach:** Gain *Durable*."}
- {kind: operator, name: Human-in-the-Loop, traits: [Response], consume: [attention, attention], produce: [capital, capital], contributes: [pink/circle], rules: "**Once:** Look at the top card of the entropy deck. You may discard it. If you do, discard five cards from the top of the operator deck."}
- {kind: operator, name: Y-Combinator, traits: [Event], consume: [attention, technology], produce: [capital, capital, attention, attention, technology], contributes: [violet/circle], rules: "Search your operator deck for a model, loadout, or feature card and play it without adding entropy."}

# ══ FEATURE (feature) ════════════════════════════════════════════════════════
- {kind: feature, name: Parallelism, traits: [Concurrency], effect: fork, rules: "Spawn two subagents.\n**Resolve:** Only 1 entropy is added this way."}

# ══ ENTROPY (entropy) ════════════════════════════════════════════════════════
- {kind: entropy, name: Token Limiter, traits: [Noise], rules: "Maximum context per agent is reduced by 1."}
- {kind: entropy, name: PII Leak, traits: [Risk], rules: "**Ongoing:** Cards that produce {attention} do not contribute to the current eval.\n**Trigger:** If cards producing at least 5 {value} are discarded from hand or context, discard this card."}
- {kind: entropy, name: Jailbreak, traits: [Subversion], rules: "**Initialize:** Attach this card to your highest {automation} production card in play. That card no longer contributes to your eval."}
- {kind: entropy, name: Model Collapse, traits: [Pollution], rules: "**Ongoing:** Generate an additional entropy whenever a card that produces {automation} enters the context."}

# ══ EVAL / OBJECTIVE (eval) ══════════════════════════════════════════════════
# hand token grammar: color/shape = exact · color/* = that color, any shape ·
#   */shape = that shape, any color · !color = banned color · * = any.
- {kind: eval, name: Personal Tech Support, traits: [Objective], par: 4, difficulty: 1, hand: [cyan/*, cyan/*, amber/*], rules: "\"How do I set my microwave clock?\"\n\"Are smart watches waterproof?\"\n\"My smart light won't turn off.\""}
- {kind: eval, name: Recruiter Agent, traits: [Objective], par: 5, difficulty: 2, hand: [violet/*, violet/*, violet/*, amber/*], rules: "\"I need a founding senior engineer, part time, seven years of Mastra experience...\""}

# ══ MODEL (model) ════════════════════════════════════════════════════════════
- {kind: model, name: Fable, traits: [Model, Anthropic], grants: [], rules: "**Entropy 1:** Gain {attention}{automation}."}

# ══ LOADOUT (loadout) ════════════════════════════════════════════════════════
- {kind: loadout, name: Sandbox, traits: [Loadout], grants: [], rules: "{value}{attention}: Discard the top card of your operator deck. Gain {automation}.\n\n**Slot:** This card can hold 1 Entropy. While a card is held here its text box is blank."}

# ══ TOKEN (token) — near-full art, no rules box, no resource slots ═══════════
# Tokens are produced by other cards; they do not act (no cost/output/contribution).
- {kind: token, name: Agent, traits: [Agent]}
