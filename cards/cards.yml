# Mastra & Commander — Operator cards (initial set).
#
# ⚠ PLACEHOLDER SET — transcribed from the engine repo's synthetic test cards
# (mastra-and-commander-server .../cards/testSet.ts, OPERATOR_CARDS). Numbers are
# for exercising the pipeline, not final balance.
#
# Fields mirror the printed face (svg/v4/ice/spec.json):
#   name         : title plate
#   traits       : type line (slim, atop the rules panel) — FFG-style
#   supertype    : ephemeral | persistent  (not rendered yet)
#   ecosystem    : anthropic | openai | google | oss (optional; not rendered yet)
#   keywords     : durable | setup (optional; not rendered yet)
#   consume      : input cost, RIGHT rail (≤5) — pips: capital|attention|technology|generic
#   produce      : output currencies, LEFT rail (≤5) — same pips
#   contributes  : bottom rail (≤3) — "color/shape"; colors pink|cyan|amber|violet|green,
#                  shapes circle|triangle|square|pentagon|hexagon
#   rules        : rules-panel text (mini-syntax: **bold**, inline {gear}{eye}{coin}{blank})

- name: Scratchpad
  traits: [Utility]
  supertype: ephemeral
  consume: []
  produce: [generic]
  contributes: [pink/triangle]
  rules: "A free chain starter. Costs nothing, produces one generic."

