# frame variant under svg/v4/<variant>/. Pip vocabulary: value=¢(capital),
# attention=eye, automation=⚙(technology), wild=◌(generic).
#
# Rules mini-syntax: **bold** · *italic* · inline pips {value}{attention}{automation}{wild}.

